openapi: 3.1.0
info:
  title: 知卷原创命题核心业务 API（设计契约）
  version: 1.3.0
  description: 知卷拟开发业务接口；不是 Hermes 原生 API，也没有随文档提供运行服务器。v1.3 补齐当前蓝图读取、完整规格读取、历史列表、当前身份与发布撤回，并将运行对账状态显式化。端到端和生产身份实现仍待开发。
  x-zhijuan-runtime:
    agent: hermes
    provider: deepseek
    additional-agent-frameworks: []
servers:
- url: http://localhost:8000
  description: 仅本地开发示例，生产必须 HTTPS。
security:
- session: []
paths:
  /v1/capabilities:
    get:
      operationId: listCapabilities
      summary: 查询真实登记的能力
      description: ''
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/exams:
    post:
      operationId: createExam
      summary: 创建试卷草稿
      description: ''
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSummary'
          headers:
            ETag:
              schema:
                type: string
                minLength: 1
                maxLength: 100
              description: 当前 revision
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSpec'
    get:
      operationId: listExams
      summary: 分页读取本组织可访问的试卷项目
      description: 只提供项目元数据，不实现跨卷题目检索。按创建时间与 id 稳定排序，游标绑定租户和过滤条件。
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1000
      responses:
        '200':
          description: 成功（拟开发）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/exams/{exam_id}:
    get:
      operationId: getExam
      summary: 按权限返回学生或教师投影
      description: teacher 视图必须具备读取答案权限；student 响应中不包含 private 字段。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ExamStudentView'
                - $ref: '#/components/schemas/ExamTeacherView'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: exam_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      - name: view
        in: query
        schema:
          type: string
          enum:
          - student
          - teacher
          default: student
  /v1/exams/{exam_id}/spec:
    patch:
      operationId: replaceExamSpec
      summary: 替换完整配置并使计划失效
      description: ''
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSummary'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: exam_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSpec'
    get:
      operationId: getExamSpec
      summary: 读取当前完整命题配置
      description: 授权后返回完整规格与 ETag。用于页面恢复，不从 Agent 历史重建。
      parameters:
      - name: exam_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 成功（拟开发）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSpec'
          headers:
            ETag:
              schema:
                type: string
              description: 带引号的当前 exam revision；修改请求用 If-Match 回传。
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/exams/{exam_id}/plan-jobs:
    post:
      operationId: planExam
      summary: 创建蓝图规划任务
      description: ''
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: exam_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
  /v1/exams/{exam_id}/generation-jobs:
    post:
      operationId: generateExam
      summary: 按已确认蓝图生成试卷
      description: 必须有与当前规格一致且已确认的计划；无计划/未确认/已过期时拒绝。正常失败、取消或未知上游结果不能直接重发计费请求。
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: exam_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
  /v1/exams/{exam_id}/validation-jobs:
    post:
      operationId: validateExam
      summary: 重跑当前版本检查
      description: ''
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: exam_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
  /v1/exams/{exam_id}/plans/{plan_id}/confirm:
    post:
      operationId: confirmPlan
      summary: 确认指定版本蓝图
      description: ''
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSummary'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: exam_id
        in: path
        required: true
        schema: *id001
      - name: plan_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                  maximum: 100000
                plan_hash: &id002
                  type: string
                  pattern: ^[0-9a-f]{64}$
              required:
              - expected_revision
              - plan_hash
  /v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: 查询任务及真实计数
      description: ''
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id001
  /v1/jobs/{job_id}/events:
    get:
      operationId: streamJobEvents
      summary: 重放和订阅持久化事件
      description: 优先 Last-Event-ID；同源 Cookie；事件无答案全文。游标过期410，客户端读取快照后重订阅。断线不取消任务。
      responses:
        '200':
          description: SSE，id 为事件序号；15秒心跳。
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: 12

                event: check.completed

                data: {"job_id":"...","sequence":12,"status":"REVIEW"}


                '
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id001
      - name: Last-Event-ID
        in: header
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
  /v1/jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      summary: 请求取消任务
      description: ''
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
              - reason
  /v1/jobs/{job_id}/retry:
    post:
      operationId: retryJob
      summary: 创建恢复任务而非复活终态
      description: ''
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
  /v1/exams/{exam_id}/slots/{slot_id}/regeneration-jobs:
    post:
      operationId: regenerateQuestion
      summary: 沿用槽位要求重新生成
      description: ''
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: exam_id
        in: path
        required: true
        schema: *id001
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
  /v1/exams/{exam_id}/slots/{slot_id}/content:
    patch:
      operationId: replaceQuestionContent
      summary: 保存新内容版本并使证据失效
      description: ''
      responses:
        '200':
          description: 成功
          content:
            application/json:
