- id: FEAT-DEV-STRUCTURE
  title: 可维护代码结构与 200 行离线门禁
  kind: DEVTOOL
  implementation: IMPLEMENTED
  task_ids:
  - DEV-03
  requires: []
  watch_paths:
  - AGENTS.md
  - README.md
  - apps/web/src/**
  - services/**
  - tools/**
  - tests/**
  - quality/**
  - docs/project-map.md
  - docs/archive/v1.4-bundle/**
  - progress/file-guide.yaml
  - spider_smartedu.py
  implementation_paths:
  - AGENTS.md
  - tools/check_code_lines.py
  - quality/suites.yaml
  invariants:
  - 自有可维护代码单文件不超过 200 物理行，生成物、第三方源码及已执行迁移除外
  - 拆分保留实际入口、交互、权限和已有未提交修改
  - 行数、构建和离线检查不替代真实页面及产品验收
  required_suites:
  - code-line-limit
  - baseline-unit
  - project-overview-tests
  last_evidence: acceptance-runs/maintenance/dev-03-code-structure-20260924-001/offline-final-6/report.json
  limitations:
  - 200 行检查、代码拆分与目录整理已实施；离线通过仅证明本次源码和检查范围，不代替各产品功能、极端排版或真实生成验收。
