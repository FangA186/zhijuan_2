- id: M0-01
  phase: M0
  title: 冻结承诺范围与用途，而不是填写“支持全部”
  owner_role: product
  reviewer_role: subject_lead
  depends_on: []
  status: NOT_STARTED
  source_files:
  - acceptance/capability-matrix.template.yaml
  - configs/business-policy.example.yaml
  target_files:
  - docs/launch-scope.yaml
  - docs/decisions/001-scope.md
  implementation_steps:
  - 逐项登记小学、初中、高中的首发学科、题型、课程范围及输出格式；三个学段不可删，具体学科和题型由产品与教研共同签名。记录每项是可生成、需人工复核，还是未支持。
  - 将“题干来源为原创生成”“历史仅恢复不检索”“网页版”“DeepSeek + Hermes”写成不可静默更改的约束。不得把 15 道数学测试题解释为最终只支持数学。
  - 区分开发演示、教师练习草稿、正式用途三种权限。M1/M2 不暴露正式发布入口；发布策略需在适用范围审查后确认，不从模型自行推断政策。
  - 列出明确非目标：题库、RAG、学生端考试、支付、自动批改、微调、全国所有教材精确映射。未签署的教材对应关系不允许 AI 自动补成事实。
  verification:
  - 检查范围文件三个学段齐全；每个承诺组合均有负责教师、检查方式与验收用例链接。
  - 用一个未承诺的听力或实作请求，核对产品应禁用或显示有边界的文字草稿，不冒充完整能力。
  failure_action: 范围未签署时，不开 M1 联调验收；允许先做独立技术验证，不允许宣传产品已经支持该范围。
  acceptance_refs:
  - FULL-02
  - FULL-08
  - FULL-27
