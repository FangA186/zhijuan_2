- id: M1-01
  phase: M1
  title: 实现业务服务入口、配置和健康检查
  owner_role: backend
  reviewer_role: ops
  depends_on:
  - M0-06
  status: NOT_STARTED
  source_files:
  - configs/business-policy.example.yaml
  - configs/deepseek.env.example
  target_files:
  - services/api/main.py
  - services/api/settings.py
  - services/api/health.py
  - infra/compose.app.yaml
  implementation_steps:
  - 创建 FastAPI app 与环境配置校验。区分 liveness（进程活着）、readiness（关键依赖可用）和模型实调用探测（可能计费），健康检查不反复调用模型。
  - 默认网页只访问业务 API；Hermes API、数据库和队列不向公网开放。设置请求体限制、统一错误体、trace_id，响应和日志不输出密钥。
  - 实现本地开发身份开关：只能监听回环或受控验收网；生产启动检测到 dev-auth 必须失败。不得信任浏览器直接传来的 tenant_id 或角色。
  - 提供完整应用 Compose 的第一版，明确服务依赖和实际健康检查；数据库/队列 compose 保留为基础设施示例，不冒充应用启动。
  verification:
  - 成功启动 API 后访问廉价健康接口；停数据库时 readiness 降级但不伪造可生成状态。
  - 缺少必需配置输出配置名而不输出值；生产模式携带开发身份开关时退出。
  failure_action: 配置错误在接单前拒绝；已有任务不能因服务重启被标为成功。保留故障码用于前端展示。
  acceptance_refs:
