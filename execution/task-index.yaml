- id: M1-03
  phase: M1
  title: 实现受控 Hermes HTTP Adapter 与状态映射
  owner_role: agent
  reviewer_role: backend
  depends_on:
  - M1-01
  - M0-05
  status: NOT_STARTED
  source_files:
  - reference_code/adapter_contract.py
  - execution/templates/hermes-capability-probe.yaml
  target_files:
  - services/hermes_adapter/http_adapter.py
  - services/hermes_adapter/runtime_factory.py
  - services/hermes_adapter/status_map.py
  implementation_steps:
  - 实现 run_stage/cancel/health/capabilities，自有协议保持稳定。每个角色取得独立受控 runtime，调用内部 /v1/runs，保存
    job_id、step_id 与 hermes_run_id 的映射。[S28][S29]
  - 输入只包含本次必要配置与指定 Skill；provider/model 由后端白名单注入，忽略教师提交的路由字段。不传 previous_response_id
    或其他任务历史；唯一会话只解决关联，不替代权限隔离。
  - 状态映射：上游 completed 还需 completed/partial/error 一致和 JSON/schema 校验；失败或迭代耗尽不能因 HTTP
    200 视作 SUCCEEDED。未知枚举视为运行异常。[S28]
  - 事件只转换成批准的计数、阶段、工具名称和脱敏错误，不把工具 preview 或原始 reasoning 全量透传浏览器。用量缺失标记 unknown，不当成零费用。
