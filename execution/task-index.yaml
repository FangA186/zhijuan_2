  - services/worker/budget.py
  - tests/chaos/
  - docs/recovery-runbook.md
  implementation_steps:
  - 在实际队列上测试投递前后、Hermes 创建前后、写回前后与确认消息前后的故障点；按租约/栅栏/幂等键恢复，不对每次崩溃重生整卷。
  - 上游创建超时先查询/重放同一原生幂等键（仅实测支持时）；支持期限外或状态不可查则标 unknown，等待授权处理，不能保证计费恰好一次。[S29][S33]
  - 取消/超时先阻止新调用和写回，再停止实际 runtime；并发预算通过事务预留，每角色调用、修订、失败和未知用量都记账。
  - 停止数据库、队列、校验器与渲染器分别验证降级；SSE 断线从业务持久事件重放，上游短期事件缓存不能当长期事实库。[S29]
  verification:
  - 重复消息不重复落题，迟到执行不覆盖当前 revision，unknown 费用不计零。
  - 429 有限退避、401 不重试、超预算停止派发；正确恢复后状态最终收敛。
  failure_action: 出现双写/无界重试/不可控计费即停止真实并发，修复后重跑所有故障点；不得只提高超时掩盖卡死。
