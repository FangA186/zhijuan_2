- id: M0-04
  phase: M0
  title: 获取固定 Hermes 来源并制作可重复安装记录
  owner_role: agent
  reviewer_role: ops
  depends_on:
  - M0-02
  status: NOT_STARTED
  source_files:
  - docs/06_DeepSeek_Hermes接入指南.md
  - configs/hermes-reviewed-fragment.yaml
  target_files:
  - install/hermes-source.lock.json
  - install/hermes-install.sh
  - vendor/hermes-agent
  - docs/runtime-baseline.md
  implementation_steps:
  - 从官方仓库选择候选提交，记录完整 40 位 commit 与来源；不是直接长期追踪 main。本章命令给出克隆与固定步骤，但实际提交须开发者审查，不在本设计包伪造一个“已验收版本”。
  - 在隔离开发环境按该提交的安装说明和锁文件安装；保留完整命令、退出码、系统与依赖版本。上游安装脚本先审阅再运行，不要求普通教师安装 Hermes。
  - 记录 git rev-parse HEAD、工作区是否修改、LICENSE 摘要和依赖锁哈希。选择子模块或锁定获取脚本二者之一；代码包缺 .git 时仍需保留可复现来源记录。
  - 将业务服务和 Hermes 的依赖环境分离，避免上游升级影响 FastAPI 业务进程；检查 core、API、所需 MCP 依赖即可，不无差别启用全部第三方工具。
  verification:
  - 第二个干净环境能取回相同提交；本地版本来自运行目录，不是从配置复制。
  - 验证命令帮助、安装日志和原生 API 启动入口；依赖冲突必须被记录，不自行取消锁定以求“能启动”。
  failure_action: 候选提交无法安装时，记录失败并另选提交重新审查；不得静默退到另一框架或绕开 Hermes。
  acceptance_refs:
