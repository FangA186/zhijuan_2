  - 改动文件与代码审查记录；命令退出码及对应断言结果
  - 失败与未执行事项；脱敏证据索引。不得只提交截图或 Agent 自述
  runtime_implemented: false
- id: M0-06
  phase: M0
  title: 冻结测试预算、质量口径与阶段门
  owner_role: qa
  reviewer_role: product
  depends_on:
  - M0-01
  - M0-03
  - M0-05
  status: NOT_STARTED
  source_files:
  - acceptance/mvp-plan.yaml
  - acceptance/minimum-cases.yaml
  - acceptance/full-cases.yaml
  target_files:
  - acceptance-runs/parameters.yaml
  - docs/signoffs/G-PREP.md
  implementation_steps:
  - 把 M1 接入、M2 功能、M3 教学质量分成三个结果。M1 三学段各一题不证明质量，M2 各五题只验证链路，M3 才执行分层盲评。
  - 明确首轮可用率、完整交付率、严重错误漏放和 REVIEW 的分母；80%/90% 是旧版建议起点，不是行业标准。未确认质量阈值不得在测试后按结果调低。
  - 在首个正式评分运行前固定模型候选、Skill、测试配置和预算。允许先做明确标记的试探测试修正规则，但试探样本不得混入后续验收分数。
  - 把每条任务负责人、输入、依赖、产物、失败处理登记到执行索引；批准 G-PREP 后进入 M1。代码实现和模型运行证据保持空白，不能因为文档检查通过改状态。
  verification:
  - 审批表包含实际人员、日期和参数版本；所有必测项有负责人，无孤立能力项。
  - 演示 NOT_RUN、BLOCKED、FAIL 都不能判定阶段通过；不允许删除失败用例以过关。
  failure_action: 任何关键阈值、负责人或首发范围缺失，则停留准备阶段；只开展独立技术试验，不签 M1/M2 已验收。
