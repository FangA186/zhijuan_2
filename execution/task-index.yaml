  - acceptance-runs/G-FULL/quality-records.jsonl
  implementation_steps:
  - 在评分前冻结输入集合、预算、模型/Skill 版本和阈值，按学段/学科/题型分层。旧版建议每学段≥100 候选、每承诺组合≥20；数量是试用起点，不是证明零错误的统计充分性。
  - 独立教师不看系统 PASS 徽标先解题/评分，记录答案正确、条件充分、教学适配、评分合理和严重缺陷；争议由第二审核者裁定，保留分歧。
  - 分别统计首轮、自动修订后、教师改后结果；记录每条有效请求，包括模型失败、拒答、取消与超预算。人工修好后的题不能记入自动首轮可用率。
  - 另用已知正确/错误控制组测检查器误拦、漏放和 REVIEW；控制组仅测试，不进生产生成上下文。不要把全转人工当作自动检查有效。
  - 同时输出样本量、分母、费用、用时和不确定性。零次观察错误不代表未来零错误；难度是预估，没有学生实测不叫校准。
  verification:
  - 三个学段分别达到事前签定指标；每个承诺组合都有实际记录，不能由大样本小学题掩盖高中失败。
  - 同一隐藏测试若用于改 Skill，后续需换新留出测试；报告不选择性删除坏结果。
  failure_action: 不达标回到对应规则/模型配置/检查器任务，形成新版本后重测；不能修改阈值使刚好通过。
