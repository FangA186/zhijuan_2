  - 改动文件与代码审查记录；命令退出码及对应断言结果
  - 失败与未执行事项；脱敏证据索引。不得只提交截图或 Agent 自述
  runtime_implemented: false
- id: M1-02
  phase: M1
  title: 把 SQL 草案变成迁移和事务仓储
  owner_role: backend
  reviewer_role: qa
  depends_on:
  - M1-01
  status: NOT_STARTED
  source_files:
