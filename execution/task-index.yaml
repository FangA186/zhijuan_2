- id: M3-05
  phase: M3
  title: 完成故障恢复、并发和预算闭环
  owner_role: backend
  reviewer_role: ops
  depends_on:
  - M2-09
  - M3-02
  status: NOT_STARTED
  source_files:
  - configs/business-policy.example.yaml
  - acceptance/full-cases.yaml
  target_files:
