  - 改动文件与代码审查记录；命令退出码及对应断言结果
  - 失败与未执行事项；脱敏证据索引。不得只提交截图或 Agent 自述
  runtime_implemented: false
- id: M0-02
  phase: M0
  title: 建立责任、环境与秘密信息清单
  owner_role: tech_lead
  reviewer_role: security
  depends_on:
  - M0-01
  status: NOT_STARTED
  source_files:
  - configs/deepseek.env.example
  - infra/README.md
  target_files:
  - docs/owners.yaml
  - .env.example
  - .gitignore
  - docs/environments.md
  implementation_steps:
  - 把 product、frontend、backend、agent、qa、subject_lead、ops、security 映射到实际负责人；可兼任开发角色，但必要审核分离仍按范围策略执行。
  - 为开发、验收、受控试用建立分离的配置、数据库和凭据。DeepSeek API Key 与 Hermes API_SERVER_KEY 是两种密钥；前者访问模型，后者保护内部
    Agent 接口，不得混用。
  - 先批准单次真实测试预算、允许的模型和网络目的地。密钥通过服务端秘密配置注入；gitignore 覆盖 .env、运行目录、模型原始日志及生成文件。
  - 选定一个可重复的开发操作系统和 Python 3.12 基线；Node、数据库、队列与浏览器版本由安装实测后精确锁定。普通开发机即可起步，不因 Agent
    自动购买 GPU。
  verification:
  - 在干净副本中确认只有占位变量，扫描前端构建与 ZIP 没有凭据。
  - 缺模型密钥时配置检查报明确失败；有密钥只说明配置存在，不把它当成功调用证明。
  failure_action: 发现密钥进仓库或日志：先吊销轮换，再清除泄露产物并复测；不得只删当前文件继续使用旧密钥。
