- id: M0-05
  phase: M0
  title: 先做 Hermes 能力与安全验证，再确定接入细节
  owner_role: agent
  reviewer_role: security
  depends_on:
  - M0-03
  - M0-04
  status: NOT_STARTED
  source_files:
  - execution/templates/hermes-capability-probe.yaml
  - reference_code/adapter_contract.py
  - configs/business-policy.example.yaml
  target_files:
  - docs/hermes-capability-report.yaml
  - docs/decisions/003-hermes-transport.md
  implementation_steps:
  - 默认验证服务器内部 HTTP Runs 接入：能力查询、创建 run、状态、事件、stop；记录真实请求与响应字段。官方文档有接口不等于候选提交已支持，逐项实测。[S28][S29]
  - 验证能限定 DeepSeek、禁用长期记忆和不必要工具、加载指定 Skill、获得结果和用量；对无法强制的每次调用预算明确写“不支持”，由外部截止和预算预留兜底，不能发明原生参数。
  - 验证新 run 不继承其他任务历史；将命题与盲解的 HOME、会话库、工作目录、临时文件和工具凭据分开。只换 session_id 或 git worktree
    不是文件访问隔离。[S04]
  - 若 HTTP 模式无法兑现工具白名单或隔离，先阻断；通过架构决策切换为同一 Hermes 的受控 Python 子进程适配，并保留相同业务协议。两种接入只选一种生产实现，不额外引入
    LangGraph。
  - 单次无敏感信息模型测试由预算负责人授权；记录真实 provider/model 与辅助调用目的地。不接受 model=hermes-agent 响应标签作为实际
    DeepSeek 型号的唯一证据。
  verification:
  - 填写能力探测表，核心项必须有实测证据或明确阻断；不得把 UNKNOWN 填成 PASS。
  - 盲解试图读取作者区秘密文件应被工具/操作系统拒绝；不仅检查最后答案有没有泄露标记。
  failure_action: 核心能力不满足则 G-PREP 不通过。保留备选路径与影响范围，再做隔离验证，不先建设大量页面假装技术风险不存在。
  acceptance_refs:
  - MIN-04
  - MIN-06
  - FULL-05
  - FULL-21
  - FULL-22
  evidence_required:
