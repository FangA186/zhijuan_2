  implementation_steps:
  - 先迁移 tenants/users/memberships、exams/plans、question_revisions/current_questions、jobs/steps/outbox/events；权限和答案表按原草案分离，迁移运行身份与应用身份分开。
  - 试卷创建、版本变化和任务创建使用事务；分值沿用 score_each_x100 整数，材料父项不重复计分；保留稳定 slot_id 和 option_id。
  - 定义内容指纹覆盖题面、答案、评分、材料与语义相关设置；blind_input_hash 仅覆盖公共解题输入。规范化 JSON 后哈希，不对含时间戳的任意字典直接做比较。
  - 增加新增读取与撤回契约需要的查询和记录；使用最小运行权限。测试跨租户复合外键和事务中 SET LOCAL 作用域，连接复用时不能泄漏上一租户。
