services:
  solver-hermes:
    init: true
    build:
      context: ../..
      dockerfile: infra/hermes-solver/Dockerfile
    environment:
      HOME: /home/solver
      HERMES_HOME: /state
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_SOLVER_UPSTREAM_KEY:?Set a distinct Hermes upstream key}
      HERMES_SOLVER_MODEL_ID: ${HERMES_SOLVER_MODEL_ID:?Set the approved DeepSeek model ID}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set the approved provider key}
    volumes:
      - solver-state:/state
      - ../../skills/blind-solver:/state/skills/blind-solver:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /work:uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [solver-internal]
  solver-entry:
    image: python:3.12-slim
    command: ["python", "/app/isolation_gateway.py"]
    environment:
      HERMES_SOLVER_API_KEY: ${HERMES_SOLVER_API_KEY:?Set the solver client key}
      HERMES_SOLVER_MODEL_ID: ${HERMES_SOLVER_MODEL_ID:?Set the approved DeepSeek model ID}
      HERMES_SOLVER_UPSTREAM_KEY: ${HERMES_SOLVER_UPSTREAM_KEY:?Set the Hermes upstream key}
      HERMES_SOLVER_UPSTREAM_URL: http://solver-hermes:8642
    volumes:
      - ../../services/hermes_adapter/isolation_gateway.py:/app/isolation_gateway.py:ro
      - ../../services/hermes_adapter/solver_output.py:/app/solver_output.py:ro
      - ../../skills/blind-solver:/app/blind-solver:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports: ["127.0.0.1:8643:8643"]
    networks: [solver-internal]
networks:
  solver-internal:
    internal: false
volumes:
  solver-state:
