  - 在测试专用通道对一题注入可定位的错误，并标 injected=true。
  - 触发 reviewer→author 修订；观察后端 repair_attempt 与版本增加。
  - 复查盲解和工具证据均对应修订后的内容；再故意持续错误直到达到两轮上限。
  - 确认超限进入待审、没有继续调用；清除注入后再跑一条 live 任务，不把注入统计成模型自然错误。
