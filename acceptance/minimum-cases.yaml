  - 结果尚未执行；测试注入须独立标记
  steps:
  - 对当前题面生成白名单 blind-input，保存其 hash 与作者私有输入清单的差异。
  - 在分离 runtime 执行 solver，尝试访问作者秘密文件并核查明确拒绝。
  - 执行结构、评分、引用和已支持数学工具，记录真实 check_id/version/status。
  - 比较独立答案并标 SAME_MODEL；不支持/冲突保留 REVIEW 或 FAIL，不能全部绿灯。
  expected_results:
  - 两个隔离任务输入摘要、实际工具记录、PASS／FAIL／REVIEW；同模型标记 SAME_MODEL
