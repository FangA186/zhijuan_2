  - 分别加载 acceptance/fixtures 中三学段规格，由教师核对并确认 taught_scope。
  - 在网页录入 2 道单选×3 分、2 道填空×2 分、1 道解答×10 分。
  - 提交后读取 GET /v1/exams/{id}/spec，核对 5 题、score_x100 合计 2000 和确认的范围。
  - 再次打开项目，确认课程限制未变；保存三个 spec、exam_id、revision 和后端返回。
  expected_results:
  - 保存三份 spec；20 分、5 个叶子题；不能自动扩大范围
