- id: MIN-06
  title: 基础检查与盲解
  phase: M2
  gate: G-MIN
  kind: functional_or_handoff
  priority: P1
  required: true
  status: NOT_RUN
  execution_mode: manual_or_future_automation
  automation_implemented: false
  school_stages: *id001
